name: Sync src to docs (GitHub Pages)

on:
  push:
    branches: [master]
    paths:
      - 'src/index.html'
      - 'src/js/**'
      - 'src/docs/**'
  workflow_dispatch:

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync src/ → docs/
        run: |
          mkdir -p docs/js docs/docs
          touch docs/.nojekyll
          cp src/index.html          docs/index.html
          cp src/js/data-sync-fixed.js   docs/js/data-sync-fixed.js
          cp src/js/apuracao-completa.js docs/js/apuracao-completa.js
          cp src/js/main.js              docs/js/main.js
          cp src/js/charts.js            docs/js/charts.js
          cp src/js/col-mgr.js           docs/js/col-mgr.js
          cp src/docs/*.html             docs/docs/

      - name: Commit and push docs/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: sync docs/ from src/ [skip ci]"
          git push
