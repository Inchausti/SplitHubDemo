<svg viewBox="0 0 860 260" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748B"/></marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#14B8A6"/></marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3B82F6"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#22C55E"/></marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#F59E0B"/></marker>
  </defs>

  <rect width="860" height="260" fill="#0F172A"/>
  <text x="430" y="22" text-anchor="middle" font-size="11" fill="#94A3B8" font-weight="700" letter-spacing=".1em">JORNADA 3 — NAVEGAÇÃO CONTEXTUAL: DASHBOARD → MÓDULOS COM FILTROS</text>

  <!-- DASHBOARD panel -->
  <g id="dashboard">
    <rect x="10" y="36" width="180" height="214" rx="8" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="100" y="54" text-anchor="middle" font-size="9" fill="#475569" font-weight="700" letter-spacing=".08em">DASHBOARD</text>

    <!-- KPI card Créditos -->
    <g id="kpi-creditos">
      <rect x="22" y="62" width="156" height="38" rx="5" fill="#04201A" stroke="#14B8A6" stroke-width="1"/>
      <text x="36" y="79" font-size="11" fill="#14B8A6" font-weight="600">Créditos IBS+CBS</text>
      <text x="36" y="92" font-size="8" fill="#2DD4BF">total · apropriados · não aprop.</text>
    </g>

    <!-- KPI card Débitos -->
    <g id="kpi-debitos">
      <rect x="22" y="110" width="156" height="38" rx="5" fill="#0D1628" stroke="#3B82F6" stroke-width="1"/>
      <text x="36" y="127" font-size="11" fill="#3B82F6" font-weight="600">Débitos Vencidos</text>
      <text x="36" y="140" font-size="8" fill="#60A5FA">saídas com RF vencido</text>
    </g>

    <!-- KPI card Pagamentos -->
    <g id="kpi-pagamentos">
      <rect x="22" y="158" width="156" height="38" rx="5" fill="#051911" stroke="#22C55E" stroke-width="1"/>
      <text x="36" y="175" font-size="11" fill="#22C55E" font-weight="600">Pagamentos em Risco</text>
      <text x="36" y="188" font-size="8" fill="#4ADE80">pendentes sem guia</text>
    </g>

    <!-- KPI card Conciliação -->
    <g id="kpi-conciliacao">
      <rect x="22" y="206" width="156" height="38" rx="5" fill="#1C1304" stroke="#F59E0B" stroke-width="1"/>
      <text x="36" y="223" font-size="11" fill="#F59E0B" font-weight="600">Conciliação Pendente</text>
      <text x="36" y="236" font-size="8" fill="#FCD34D">DFs aguardando etapa 1+2</text>
    </g>
  </g>

  <!-- arrows -->
  <line x1="178" y1="81" x2="278" y2="68" stroke="#14B8A6" stroke-width="1.5" marker-end="url(#arr-teal)"/>
  <text x="220" y="64" text-anchor="middle" font-size="8" fill="#14B8A6">dashIrParaCreditos()</text>

  <line x1="178" y1="129" x2="278" y2="140" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="220" y="126" text-anchor="middle" font-size="8" fill="#60A5FA">dashIrParaDebitos()</text>

  <line x1="178" y1="177" x2="278" y2="200" stroke="#22C55E" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="218" y="180" text-anchor="middle" font-size="8" fill="#4ADE80">dashIrParaPagamentosRisco()</text>

  <line x1="178" y1="225" x2="278" y2="236" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-amber)"/>
  <text x="218" y="222" text-anchor="middle" font-size="8" fill="#FCD34D">dashIrParaConciliacao()</text>

  <!-- MÓDULOS destino -->
  <g id="modulo-creditos">
    <rect x="280" y="44" width="180" height="56" rx="6" fill="#04201A" stroke="#14B8A6" stroke-width="1.5"/>
    <text x="370" y="62" text-anchor="middle" font-size="10" fill="#14B8A6" font-weight="700">Módulo Créditos</text>
    <text x="370" y="76" text-anchor="middle" font-size="8.5" fill="#94A3B8">Visão Geral + Listagem</text>
    <rect x="290" y="80" width="160" height="14" rx="3" fill="#04201A" stroke="#14B8A6" stroke-width=".5" stroke-dasharray="3,2"/>
    <text x="370" y="90" text-anchor="middle" font-size="8" fill="#2DD4BF">filtros limpos · todos os status</text>
  </g>

  <g id="modulo-debitos">
    <rect x="280" y="112" width="180" height="56" rx="6" fill="#0D1628" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="370" y="130" text-anchor="middle" font-size="10" fill="#3B82F6" font-weight="700">Módulo Débitos</text>
    <text x="370" y="144" text-anchor="middle" font-size="8.5" fill="#94A3B8">Listagem de RFs de saída</text>
    <rect x="290" y="148" width="160" height="14" rx="3" fill="#0D1628" stroke="#3B82F6" stroke-width=".5" stroke-dasharray="3,2"/>
    <text x="370" y="158" text-anchor="middle" font-size="8" fill="#60A5FA">status = vencido (pré-filtrado)</text>
  </g>

  <g id="modulo-pagamentos">
    <rect x="280" y="180" width="180" height="56" rx="6" fill="#051911" stroke="#22C55E" stroke-width="1.5"/>
    <text x="370" y="198" text-anchor="middle" font-size="10" fill="#22C55E" font-weight="700">Módulo Pagamentos</text>
    <text x="370" y="212" text-anchor="middle" font-size="8.5" fill="#94A3B8">Gestão + guias pendentes</text>
    <rect x="290" y="216" width="160" height="14" rx="3" fill="#051911" stroke="#22C55E" stroke-width=".5" stroke-dasharray="3,2"/>
    <text x="370" y="226" text-anchor="middle" font-size="8" fill="#4ADE80">status = pendente (pré-filtrado)</text>
  </g>

  <g id="modulo-conciliacao">
    <rect x="280" y="242" width="180" height="14" rx="4" fill="#1C1304" stroke="#F59E0B" stroke-width="1"/>
    <text x="370" y="252" text-anchor="middle" font-size="8" fill="#FCD34D">Módulo Conciliação</text>
  </g>

  <!-- COMO FUNCIONA -->
  <g id="mecanismo-navegacao">
    <rect x="490" y="44" width="362" height="176" rx="8" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="671" y="62" text-anchor="middle" font-size="9" fill="#475569" font-weight="700" letter-spacing=".07em">MECANISMO DE NAVEGAÇÃO</text>
    <text x="506" y="82" font-size="9" fill="#64748B">1.  showView(id, btn) — ativa o módulo na sidebar</text>
    <text x="506" y="100" font-size="9" fill="#64748B">2.  filtro aplicado nas variáveis de estado antes do render</text>
    <text x="506" y="118" font-size="9" fill="#64748B">3.  renderizarTabela() — respeita o filtro ativo</text>
    <text x="506" y="136" font-size="9" fill="#64748B">4.  chip de filtro visível no topo do módulo</text>
    <line x1="506" y1="148" x2="844" y2="148" stroke="#334155" stroke-width="1"/>
    <text x="506" y="164" font-size="8" fill="#475569">Débitos:      _filtrosDebitos.status = 'vencido'</text>
    <text x="506" y="178" font-size="8" fill="#475569">Pagamentos: _filtrosPagamentos.status = 'pendente'</text>
    <text x="506" y="192" font-size="8" fill="#475569">Créditos:     creditosFiltroStatus = null (reset)</text>
    <text x="506" y="208" font-size="8" fill="#334155">Art. 48 LC 214/2025 — base legal dos filtros de crédito</text>
  </g>

  <line x1="460" y1="122" x2="490" y2="122" stroke="#334155" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr)"/>
</svg>
