<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748B"/></marker>
    <marker id="at" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#14B8A6"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#F43F5E"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#22C55E"/></marker>
    <marker id="aa" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#F59E0B"/></marker>
    <marker id="ap" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8B5CF6"/></marker>
  </defs>

  <rect width="960" height="460" fill="#0F172A"/>

  <!-- TÍTULO -->
  <text x="480" y="24" text-anchor="middle" font-size="11" fill="#94A3B8" font-weight="700" letter-spacing=".1em">CONCILIAÇÃO FINANCEIRA — VALIDAÇÃO DE PAGAMENTOS RAD E FORNECEDOR CONTRA AGENDA DE APURAÇÃO</text>

  <!-- AGENDA DA APURAÇÃO ASSISTIDA (input) -->
  <g id="agenda-apuracao">
    <rect x="12" y="44" width="168" height="280" rx="8" fill="#0D1628" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="96" y="62" text-anchor="middle" font-size="9" fill="#3B82F6" font-weight="700" letter-spacing=".07em">AGENDA APURAÇÃO</text>
    <text x="96" y="74" text-anchor="middle" font-size="7.5" fill="#3B82F6">confirmado via Etapa 1</text>
    <line x1="24" y1="81" x2="168" y2="81" stroke="#3B82F6" stroke-opacity=".25" stroke-width="1"/>

    <text x="24" y="99" font-size="8.5" fill="#60A5FA" font-weight="600">Guias emitidas pela RF:</text>

    <text x="24" y="117" font-size="8" fill="#64748B">RF IBS</text>
    <text x="168" y="117" text-anchor="end" font-size="8" fill="#14B8A6">valor · vencimento</text>

    <text x="24" y="133" font-size="8" fill="#64748B">RF CBS</text>
    <text x="168" y="133" text-anchor="end" font-size="8" fill="#14B8A6">valor · vencimento</text>

    <line x1="24" y1="143" x2="168" y2="143" stroke="#334155" stroke-width=".5"/>

    <text x="24" y="161" font-size="8.5" fill="#60A5FA" font-weight="600">Contratos ativos:</text>
    <text x="24" y="177" font-size="8" fill="#64748B">Prazo pagamento</text>
    <text x="168" y="177" text-anchor="end" font-size="8" fill="#60A5FA">30 / 60 / 90 / 120 d</text>
    <text x="24" y="193" font-size="8" fill="#64748B">Método contratual</text>
    <text x="168" y="193" text-anchor="end" font-size="8" fill="#8B5CF6">RAD ou Fornecedor</text>
    <text x="24" y="209" font-size="8" fill="#64748B">Vigência contrato</text>
    <text x="168" y="209" text-anchor="end" font-size="8" fill="#60A5FA">início – fim</text>

    <line x1="24" y1="219" x2="168" y2="219" stroke="#334155" stroke-width=".5"/>

    <text x="24" y="237" font-size="8.5" fill="#60A5FA" font-weight="600">Indicadores de risco:</text>
    <text x="24" y="253" font-size="8" fill="#64748B">Em risco</text>
    <text x="168" y="253" text-anchor="end" font-size="8" fill="#F43F5E">venc. ≤ 30 dias</text>
    <text x="24" y="269" font-size="8" fill="#64748B">Alerta pré-venc.</text>
    <text x="168" y="269" text-anchor="end" font-size="8" fill="#F59E0B">D-7 · email auto</text>
    <text x="24" y="285" font-size="8" fill="#64748B">Cobrança pós-venc.</text>
    <text x="168" y="285" text-anchor="end" font-size="8" fill="#F43F5E">D+1 · até 4x</text>

    <line x1="24" y1="296" x2="168" y2="296" stroke="#334155" stroke-width=".5"/>
    <text x="96" y="313" text-anchor="middle" font-size="7.5" fill="#334155">Fonte: Etapa 1 confirmado</text>
  </g>

  <!-- MÉTODOS DE PAGAMENTO -->
  <g id="metodos-pagamento">

    <!-- RAD -->
    <rect x="210" y="44" width="152" height="140" rx="8" fill="#160D2B" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="286" y="63" text-anchor="middle" font-size="9" fill="#8B5CF6" font-weight="700" letter-spacing=".07em">MÉTODO RAD</text>
    <text x="286" y="75" text-anchor="middle" font-size="7.5" fill="#8B5CF6">Recolhimento Automático</text>
    <line x1="222" y1="82" x2="350" y2="82" stroke="#8B5CF6" stroke-opacity=".25" stroke-width="1"/>
    <text x="222" y="98" font-size="8" fill="#64748B">Débito automático na</text>
    <text x="222" y="110" font-size="8" fill="#64748B">conta do contribuinte</text>
    <text x="222" y="122" font-size="8" fill="#64748B">pela Receita Federal</text>
    <text x="222" y="140" font-size="8" fill="#64748B">dataPagamento: automática</text>
    <text x="222" y="153" font-size="8" fill="#8B5CF6" font-weight="600">rf.metodoPagamento = RAD</text>
    <text x="222" y="168" font-size="7.5" fill="#475569">Contratos: CT-0002, CT-0004,</text>
    <text x="222" y="178" font-size="7.5" fill="#475569">CT-0007, CT-0009</text>
  </g>

    <!-- Fornecedor -->
  <g id="metodo-fornecedor">
    <rect x="210" y="200" width="152" height="124" rx="8" fill="#04201A" stroke="#14B8A6" stroke-width="1.5"/>
    <text x="286" y="219" text-anchor="middle" font-size="9" fill="#14B8A6" font-weight="700" letter-spacing=".07em">MÉTODO FORNECEDOR</text>
    <line x1="222" y1="226" x2="350" y2="226" stroke="#14B8A6" stroke-opacity=".25" stroke-width="1"/>
    <text x="222" y="243" font-size="8" fill="#64748B">Pagamento manual pelo</text>
    <text x="222" y="255" font-size="8" fill="#64748B">fornecedor via guia</text>
    <text x="222" y="267" font-size="8" fill="#64748B">IBS/DARF CBS emitida</text>
    <text x="222" y="285" font-size="8" fill="#64748B">dataPagamento: manual</text>
    <text x="222" y="298" font-size="8" fill="#14B8A6" font-weight="600">rf.metodoPagamento = Fornecedor</text>
    <text x="222" y="315" font-size="7.5" fill="#475569">Prazos: 30/60/90 dias</text>
  </g>

  <!-- arrows agenda → métodos -->
  <line x1="180" y1="100" x2="210" y2="100" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#ap)"/>
  <line x1="180" y1="262" x2="210" y2="262" stroke="#14B8A6" stroke-width="1.5" marker-end="url(#at)"/>

  <!-- DECISÃO: IBS + CBS pagos? -->
  <g id="decisao-financeira">
    <line x1="362" y1="114" x2="420" y2="200" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="362" y1="262" x2="420" y2="240" stroke="#14B8A6" stroke-width="1.5" marker-end="url(#a)"/>
    <polygon points="466,200 510,222 466,244 422,222" fill="#161B27" stroke="#475569" stroke-width="1.5"/>
    <text x="466" y="216" text-anchor="middle" font-size="8" fill="#94A3B8">IBS RF</text>
    <text x="466" y="228" text-anchor="middle" font-size="8" fill="#94A3B8">CBS RF</text>
  </g>

  <!-- RESULTADOS FINANCEIROS -->

  <!-- COMPLETO -->
  <g id="fin-completo">
    <rect x="548" y="64" width="158" height="76" rx="7" fill="#051911" stroke="#22C55E" stroke-width="2"/>
    <text x="627" y="84" text-anchor="middle" font-size="9" fill="#22C55E" font-weight="700" letter-spacing=".06em">CONCILIADO ✓</text>
    <text x="627" y="102" text-anchor="middle" font-size="14" fill="#22C55E" font-weight="700">completo</text>
    <text x="627" y="118" text-anchor="middle" font-size="8" fill="#4ADE80">IBS pago + CBS pago</text>
    <text x="627" y="130" text-anchor="middle" font-size="8" fill="#4ADE80">sem inconsistência</text>
  </g>
  <line x1="510" y1="215" x2="548" y2="102" stroke="#22C55E" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="526" y="160" font-size="8" fill="#22C55E">ambos pagos</text>
  <text x="526" y="170" font-size="8" fill="#22C55E">sem inc.</text>

  <!-- PARCIAL -->
  <g id="fin-parcial">
    <rect x="548" y="160" width="158" height="76" rx="7" fill="#1C1304" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="627" y="180" text-anchor="middle" font-size="9" fill="#F59E0B" font-weight="700" letter-spacing=".06em">PARCIAL</text>
    <text x="627" y="198" text-anchor="middle" font-size="14" fill="#F59E0B" font-weight="700">parcial</text>
    <text x="627" y="214" text-anchor="middle" font-size="8" fill="#FCD34D">1 pago + inconsistência</text>
    <text x="627" y="226" text-anchor="middle" font-size="8" fill="#FCD34D">ou só 1 RF pago</text>
  </g>
  <line x1="510" y1="222" x2="548" y2="200" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#aa)"/>

  <!-- INCONSISTENTE -->
  <g id="fin-inconsistente">
    <rect x="548" y="256" width="158" height="76" rx="7" fill="#1A0509" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="627" y="276" text-anchor="middle" font-size="9" fill="#F43F5E" font-weight="700" letter-spacing=".06em">NÃO CONCILIADO</text>
    <text x="627" y="294" text-anchor="middle" font-size="14" fill="#F43F5E" font-weight="700">inconsistente</text>
    <text x="627" y="310" text-anchor="middle" font-size="8" fill="#F87171">RF com status inconsistencia</text>
    <text x="627" y="322" text-anchor="middle" font-size="8" fill="#F87171">requer revisão imediata</text>
  </g>
  <line x1="510" y1="228" x2="548" y2="290" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#ar)"/>

  <!-- PENDENTE -->
  <g id="fin-pendente">
    <rect x="548" y="352" width="158" height="68" rx="7" fill="#1C1304" stroke="#F59E0B" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="627" y="372" text-anchor="middle" font-size="9" fill="#F59E0B" font-weight="700" letter-spacing=".06em">PENDENTE</text>
    <text x="627" y="390" text-anchor="middle" font-size="14" fill="#F59E0B" font-weight="600">pendente</text>
    <text x="627" y="408" text-anchor="middle" font-size="8" fill="#FCD34D">nenhum RF pago</text>
  </g>
  <line x1="466" y1="244" x2="466" y2="386" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#aa)"/>
  <line x1="466" y1="386" x2="548" y2="386" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#aa)"/>

  <!-- GESTÃO DE FORNECEDORES / VENCIMENTOS -->
  <g id="gestao-fornecedores">
    <rect x="744" y="44" width="204" height="370" rx="8" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="846" y="63" text-anchor="middle" font-size="9" fill="#475569" font-weight="700" letter-spacing=".07em">GESTÃO SOB CONTROLE</text>
    <line x1="756" y1="70" x2="936" y2="70" stroke="#334155" stroke-width="1"/>

    <!-- completo downstream -->
    <text x="756" y="88" font-size="8.5" fill="#22C55E" font-weight="600">completo →</text>
    <text x="756" y="102" font-size="8" fill="#64748B">· RF → status apropriado</text>
    <text x="756" y="115" font-size="8" fill="#64748B">· Crédito disponível para uso</text>
    <text x="756" y="128" font-size="8" fill="#64748B">· KPI pipeline: Crédito Apropriado</text>
    <text x="756" y="141" font-size="8" fill="#64748B">· comprovante = true</text>

    <line x1="756" y1="152" x2="936" y2="152" stroke="#334155" stroke-width=".5"/>

    <!-- parcial downstream -->
    <text x="756" y="170" font-size="8.5" fill="#F59E0B" font-weight="600">parcial →</text>
    <text x="756" y="184" font-size="8" fill="#64748B">· proxAcao: quitar imposto pendente</text>
    <text x="756" y="197" font-size="8" fill="#64748B">· RF pendente monitorado</text>
    <text x="756" y="210" font-size="8" fill="#64748B">· Vencimento na agenda</text>
    <text x="756" y="223" font-size="8" fill="#64748B">· Alerta D-7 disparado</text>

    <line x1="756" y1="234" x2="936" y2="234" stroke="#334155" stroke-width=".5"/>

    <!-- inconsistente downstream -->
    <text x="756" y="252" font-size="8.5" fill="#F43F5E" font-weight="600">inconsistente →</text>
    <text x="756" y="266" font-size="8" fill="#64748B">· proxAcao: resolver inconsistência</text>
    <text x="756" y="279" font-size="8" fill="#64748B">· Registro em Inconsistências</text>
    <text x="756" y="292" font-size="8" fill="#64748B">· Cobrança pós-vencimento D+1</text>
    <text x="756" y="305" font-size="8" fill="#64748B">· Risco de perda do crédito</text>

    <line x1="756" y1="316" x2="936" y2="316" stroke="#334155" stroke-width=".5"/>

    <!-- pendente downstream -->
    <text x="756" y="334" font-size="8.5" fill="#F59E0B" font-weight="600">pendente →</text>
    <text x="756" y="348" font-size="8" fill="#64748B">· Guia aguardando pagamento</text>
    <text x="756" y="361" font-size="8" fill="#64748B">· Prazo contratual monitorado</text>
    <text x="756" y="374" font-size="8" fill="#64748B">· Alerta pré-vencimento ativo</text>
    <text x="756" y="387" font-size="8" fill="#64748B">· Vencimento → em_risco → vencido</text>

    <line x1="756" y1="398" x2="936" y2="398" stroke="#334155" stroke-width=".5"/>
    <text x="846" y="412" text-anchor="middle" font-size="7.5" fill="#334155">Prazos contratuais: 30/60/90/120 dias</text>
  </g>

  <!-- arrows resultado → gestão -->
  <line x1="706" y1="102" x2="744" y2="110" stroke="#22C55E" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#ag)"/>
  <line x1="706" y1="198" x2="744" y2="190" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#aa)"/>
  <line x1="706" y1="294" x2="744" y2="265" stroke="#F43F5E" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#ar)"/>
  <line x1="706" y1="386" x2="744" y2="360" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#aa)"/>

  <!-- LEGENDA BASE LEGAL -->
  <text x="480" y="440" text-anchor="middle" font-size="8.5" fill="#334155">LC 214/2025 · Art. 48 — crédito IBS+CBS · RAD: Recolhimento Automático Débito autorizado pela RFB · Prazos: prazo contratual + agenda da apuração assistida</text>
</svg>
