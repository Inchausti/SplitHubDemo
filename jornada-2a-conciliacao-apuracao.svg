<svg viewBox="0 0 920 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748B"/></marker>
    <marker id="at" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#14B8A6"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#F43F5E"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3B82F6"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#22C55E"/></marker>
    <marker id="aa" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#F59E0B"/></marker>
  </defs>

  <rect width="920" height="440" fill="#0F172A"/>

  <!-- TÍTULO -->
  <text x="460" y="24" text-anchor="middle" font-size="11" fill="#94A3B8" font-weight="700" letter-spacing=".1em">CONCILIAÇÃO DE APURAÇÃO — VALIDAÇÃO DA NF CONTRA APURAÇÃO ASSISTIDA (GOV)</text>

  <!-- DF INGERIDA -->
  <g id="df-ingestao">
    <rect x="12" y="48" width="130" height="340" rx="8" fill="#161B27" stroke="#334155" stroke-width="1.5"/>
    <text x="77" y="67" text-anchor="middle" font-size="9" fill="#475569" font-weight="700" letter-spacing=".08em">DF INGERIDA</text>
    <line x1="24" y1="74" x2="130" y2="74" stroke="#334155" stroke-width="1"/>

    <!-- campos da NF -->
    <text x="24" y="92" font-size="8.5" fill="#94A3B8" font-weight="600">Campos validados na DF:</text>

    <text x="24" y="110" font-size="8" fill="#64748B">① Tipo DF</text>
    <text x="108" y="110" text-anchor="end" font-size="8" fill="#3B82F6">NF-e / NFS-e / NFCom</text>

    <text x="24" y="126" font-size="8" fill="#64748B">② Chave de Acesso</text>
    <text x="108" y="126" text-anchor="end" font-size="8" fill="#3B82F6">44 dígitos</text>

    <text x="24" y="142" font-size="8" fill="#64748B">③ Número NF</text>
    <text x="108" y="142" text-anchor="end" font-size="8" fill="#3B82F6">série + número</text>

    <text x="24" y="158" font-size="8" fill="#64748B">④ CNPJ Emitente</text>
    <text x="108" y="158" text-anchor="end" font-size="8" fill="#3B82F6">14 dígitos</text>

    <text x="24" y="174" font-size="8" fill="#64748B">⑤ CNPJ Destinatário</text>
    <text x="108" y="174" text-anchor="end" font-size="8" fill="#3B82F6">Positivo</text>

    <text x="24" y="190" font-size="8" fill="#64748B">⑥ Data de Emissão</text>
    <text x="108" y="190" text-anchor="end" font-size="8" fill="#3B82F6">ISO 8601</text>

    <text x="24" y="206" font-size="8" fill="#64748B">⑦ Competência</text>
    <text x="108" y="206" text-anchor="end" font-size="8" fill="#3B82F6">mês/ano apuração</text>

    <text x="24" y="222" font-size="8" fill="#64748B">⑧ Valor Total DF</text>
    <text x="108" y="222" text-anchor="end" font-size="8" fill="#3B82F6">valorDF empresa</text>

    <text x="24" y="238" font-size="8" fill="#64748B">⑨ Alíquota IBS</text>
    <text x="108" y="238" text-anchor="end" font-size="8" fill="#14B8A6">transição 2026</text>

    <text x="24" y="254" font-size="8" fill="#64748B">⑩ Valor RF IBS</text>
    <text x="108" y="254" text-anchor="end" font-size="8" fill="#14B8A6">calculado · Art.48</text>

    <text x="24" y="270" font-size="8" fill="#64748B">⑪ Alíquota CBS</text>
    <text x="108" y="270" text-anchor="end" font-size="8" fill="#14B8A6">transição 2026</text>

    <text x="24" y="286" font-size="8" fill="#64748B">⑫ Valor RF CBS</text>
    <text x="108" y="286" text-anchor="end" font-size="8" fill="#14B8A6">calculado · Art.48</text>

    <text x="24" y="302" font-size="8" fill="#64748B">⑬ Tipo Operação</text>
    <text x="108" y="302" text-anchor="end" font-size="8" fill="#3B82F6">entrada / saída</text>

    <text x="24" y="318" font-size="8" fill="#64748B">⑭ Schema XML</text>
    <text x="108" y="318" text-anchor="end" font-size="8" fill="#22C55E">validado SplitHub</text>

    <line x1="24" y1="330" x2="130" y2="330" stroke="#334155" stroke-width="1"/>
    <text x="77" y="346" text-anchor="middle" font-size="8" fill="#475569">14 campos · ingestão</text>
    <text x="77" y="360" text-anchor="middle" font-size="8" fill="#475569">automática via API</text>
    <text x="77" y="376" text-anchor="middle" font-size="8.5" fill="#94A3B8" font-weight="600">protocolo APU2026-</text>
  </g>

  <!-- ARROW DF → GOV -->
  <line x1="142" y1="218" x2="220" y2="218" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="181" y="211" text-anchor="middle" font-size="8" fill="#475569">cruzamento</text>

  <!-- APURAÇÃO ASSISTIDA GOV -->
  <g id="apuracao-gov">
    <rect x="222" y="48" width="148" height="340" rx="8" fill="#0D1628" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="296" y="67" text-anchor="middle" font-size="9" fill="#3B82F6" font-weight="700" letter-spacing=".07em">APURAÇÃO ASSISTIDA</text>
    <text x="296" y="79" text-anchor="middle" font-size="8" fill="#3B82F6" letter-spacing=".05em">(GOV — SPED / RFB)</text>
    <line x1="234" y1="86" x2="358" y2="86" stroke="#3B82F6" stroke-opacity=".3" stroke-width="1"/>

    <text x="234" y="104" font-size="8.5" fill="#60A5FA" font-weight="600">Dados da Receita Federal:</text>

    <text x="234" y="122" font-size="8" fill="#64748B">① Tipo DF</text>
    <text x="348" y="122" text-anchor="end" font-size="8" fill="#60A5FA">espelhado SPED</text>

    <text x="234" y="138" font-size="8" fill="#64748B">② Chave de Acesso</text>
    <text x="348" y="138" text-anchor="end" font-size="8" fill="#60A5FA">NF-e autorizada</text>

    <text x="234" y="154" font-size="8" fill="#64748B">③ Número NF</text>
    <text x="348" y="154" text-anchor="end" font-size="8" fill="#60A5FA">confirmado RFB</text>

    <text x="234" y="170" font-size="8" fill="#64748B">④ CNPJ Emitente</text>
    <text x="348" y="170" text-anchor="end" font-size="8" fill="#60A5FA">cadastro RFB</text>

    <text x="234" y="186" font-size="8" fill="#64748B">⑤ CNPJ Destinatário</text>
    <text x="348" y="186" text-anchor="end" font-size="8" fill="#60A5FA">cadastro RFB</text>

    <text x="234" y="202" font-size="8" fill="#64748B">⑥ Data de Emissão</text>
    <text x="348" y="202" text-anchor="end" font-size="8" fill="#60A5FA">SPED autorização</text>

    <text x="234" y="218" font-size="8" fill="#64748B">⑦ Competência</text>
    <text x="348" y="218" text-anchor="end" font-size="8" fill="#60A5FA">janela tributária</text>

    <text x="234" y="234" font-size="8" fill="#64748B">⑧ Valor Gov</text>
    <text x="348" y="234" text-anchor="end" font-size="8" fill="#60A5FA">valorGov RFB</text>

    <text x="234" y="250" font-size="8" fill="#64748B">⑨ Alíquota IBS</text>
    <text x="348" y="250" text-anchor="end" font-size="8" fill="#14B8A6">tabela vigente 2026</text>

    <text x="234" y="266" font-size="8" fill="#64748B">⑩ RF IBS apurado</text>
    <text x="348" y="266" text-anchor="end" font-size="8" fill="#14B8A6">cálculo RFB</text>

    <text x="234" y="282" font-size="8" fill="#64748B">⑪ Alíquota CBS</text>
    <text x="348" y="282" text-anchor="end" font-size="8" fill="#14B8A6">tabela vigente 2026</text>

    <text x="234" y="298" font-size="8" fill="#64748B">⑫ RF CBS apurado</text>
    <text x="348" y="298" text-anchor="end" font-size="8" fill="#14B8A6">cálculo RFB</text>

    <text x="234" y="314" font-size="8" fill="#64748B">⑬ Tipo Operação</text>
    <text x="348" y="314" text-anchor="end" font-size="8" fill="#60A5FA">confirmado RFB</text>

    <line x1="234" y1="326" x2="358" y2="326" stroke="#3B82F6" stroke-opacity=".2" stroke-width="1"/>
    <text x="296" y="344" text-anchor="middle" font-size="8" fill="#3B82F6">Δ = valorGov − valorDF</text>
    <text x="296" y="358" text-anchor="middle" font-size="8" fill="#3B82F6">threshold: R$ 5,00</text>
    <text x="296" y="374" text-anchor="middle" font-size="7.5" fill="#475569">Art. 153-A LC 214/2025</text>
  </g>

  <!-- MOTOR DE DECISÃO -->
  <g id="decisao-apuracao">
    <line x1="370" y1="218" x2="430" y2="218" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#ab)"/>
    <polygon points="465,198 505,218 465,238 425,218" fill="#0D1628" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="465" y="214" text-anchor="middle" font-size="8.5" fill="#60A5FA">Δ ≤</text>
    <text x="465" y="226" text-anchor="middle" font-size="8.5" fill="#60A5FA">R$ 5?</text>
  </g>

  <!-- CONFIRMADO -->
  <g id="confirmado">
    <rect x="530" y="60" width="160" height="72" rx="7" fill="#04201A" stroke="#14B8A6" stroke-width="1.5"/>
    <text x="610" y="80" text-anchor="middle" font-size="9" fill="#14B8A6" font-weight="700" letter-spacing=".06em">CONCILIADO ✓</text>
    <text x="610" y="98" text-anchor="middle" font-size="13" fill="#14B8A6" font-weight="700">confirmado</text>
    <text x="610" y="114" text-anchor="middle" font-size="8" fill="#2DD4BF">protocolo APU2026- emitido</text>
    <text x="610" y="126" text-anchor="middle" font-size="8" fill="#2DD4BF">todos os 14 campos OK</text>
  </g>
  <line x1="505" y1="208" x2="530" y2="100" stroke="#14B8A6" stroke-width="1.5" marker-end="url(#at)"/>
  <text x="516" y="155" font-size="8" fill="#14B8A6">sim</text>

  <!-- DIVERGENTE -->
  <g id="divergente">
    <rect x="530" y="170" width="160" height="72" rx="7" fill="#1A0509" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="610" y="190" text-anchor="middle" font-size="9" fill="#F43F5E" font-weight="700" letter-spacing=".06em">NÃO CONCILIADO</text>
    <text x="610" y="208" text-anchor="middle" font-size="13" fill="#F43F5E" font-weight="700">divergente</text>
    <text x="610" y="224" text-anchor="middle" font-size="8" fill="#F87171">Δ valor destacado · requer ação</text>
    <text x="610" y="236" text-anchor="middle" font-size="8" fill="#F87171">sem protocolo emitido</text>
  </g>
  <line x1="505" y1="218" x2="530" y2="206" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar)"/>
  <text x="517" y="218" font-size="8" fill="#F43F5E">não</text>

  <!-- PENDENTE -->
  <g id="pendente">
    <rect x="530" y="280" width="160" height="72" rx="7" fill="#1C1304" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="610" y="300" text-anchor="middle" font-size="9" fill="#F59E0B" font-weight="700" letter-spacing=".06em">PENDENTE</text>
    <text x="610" y="318" text-anchor="middle" font-size="13" fill="#F59E0B" font-weight="700">pendente</text>
    <text x="610" y="334" text-anchor="middle" font-size="8" fill="#FCD34D">Gov ainda não apurou</text>
    <text x="610" y="346" text-anchor="middle" font-size="8" fill="#FCD34D">bloqueia Etapa 2</text>
  </g>
  <line x1="465" y1="238" x2="465" y2="316" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#aa)"/>
  <line x1="465" y1="316" x2="530" y2="316" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#aa)"/>
  <text x="471" y="285" font-size="8" fill="#F59E0B">sem resp.</text>

  <!-- EFEITOS DOWNSTREAM -->
  <g id="efeitos">
    <rect x="730" y="48" width="178" height="344" rx="8" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="819" y="67" text-anchor="middle" font-size="9" fill="#475569" font-weight="700" letter-spacing=".07em">EFEITOS DOWNSTREAM</text>
    <line x1="742" y1="74" x2="896" y2="74" stroke="#334155" stroke-width="1"/>

    <text x="742" y="92" font-size="8.5" fill="#14B8A6" font-weight="600">confirmado →</text>
    <text x="742" y="106" font-size="8" fill="#64748B">· RF IBS habilitado para pagamento</text>
    <text x="742" y="119" font-size="8" fill="#64748B">· RF CBS habilitado para pagamento</text>
    <text x="742" y="132" font-size="8" fill="#64748B">· Etapa 2 desbloqueada</text>
    <text x="742" y="145" font-size="8" fill="#64748B">· Protocolo APU2026- persistido</text>
    <text x="742" y="158" font-size="8" fill="#64748B">· KPI pipeline: +1 Gov Confirmou</text>

    <line x1="742" y1="170" x2="896" y2="170" stroke="#334155" stroke-width=".5"/>

    <text x="742" y="188" font-size="8.5" fill="#F43F5E" font-weight="600">divergente →</text>
    <text x="742" y="202" font-size="8" fill="#64748B">· Δ valor exibido na coluna</text>
    <text x="742" y="215" font-size="8" fill="#64748B">· Cria registro Inconsistências</text>
    <text x="742" y="228" font-size="8" fill="#64748B">· Etapa 2 pode avançar (avalia RF)</text>
    <text x="742" y="241" font-size="8" fill="#64748B">· Ação requerida: revisar NF</text>

    <line x1="742" y1="253" x2="896" y2="253" stroke="#334155" stroke-width=".5"/>

    <text x="742" y="271" font-size="8.5" fill="#F59E0B" font-weight="600">pendente →</text>
    <text x="742" y="285" font-size="8" fill="#64748B">· Etapa 2 BLOQUEADA</text>
    <text x="742" y="298" font-size="8" fill="#64748B">· proxAcao: aguardar apuração</text>
    <text x="742" y="311" font-size="8" fill="#64748B">· KPI: +1 Pendente no pipeline</text>
    <text x="742" y="324" font-size="8" fill="#64748B">· Monitorado no dashboard</text>

    <line x1="742" y1="336" x2="896" y2="336" stroke="#334155" stroke-width=".5"/>
    <text x="819" y="354" text-anchor="middle" font-size="7.5" fill="#334155">Distribuição média: 70% confirmado</text>
    <text x="819" y="366" text-anchor="middle" font-size="7.5" fill="#334155">20% divergente · 10% pendente</text>
    <text x="819" y="380" text-anchor="middle" font-size="7.5" fill="#475569">Art. 48 + Art. 153-A LC 214/2025</text>
  </g>

  <!-- arrows resultado → efeitos -->
  <line x1="690" y1="96" x2="730" y2="140" stroke="#14B8A6" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#at)"/>
  <line x1="690" y1="206" x2="730" y2="210" stroke="#F43F5E" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#ar)"/>
  <line x1="690" y1="316" x2="730" y2="285" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#aa)"/>

  <!-- LEGENDA BASE LEGAL -->
  <text x="460" y="418" text-anchor="middle" font-size="8.5" fill="#334155">LC 214/2025 · Art. 48 — créditos IBS+CBS na entrada · Art. 153-A — apuração assistida pelo Comitê Gestor / Receita Federal</text>
</svg>
