<svg viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748B"/></marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#14B8A6"/></marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#F43F5E"/></marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#F59E0B"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#22C55E"/></marker>
  </defs>

  <rect width="860" height="380" fill="#0F172A"/>
  <text x="430" y="22" text-anchor="middle" font-size="11" fill="#94A3B8" font-weight="700" letter-spacing=".1em">JORNADA 2 — MÓDULO DE CONCILIAÇÃO (ETAPA 1 → ETAPA 2)</text>

  <!-- DF entrada -->
  <g id="df-entrada">
    <rect x="10" y="155" width="88" height="52" rx="6" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="54" y="175" text-anchor="middle" font-size="10" fill="#475569" font-weight="700" letter-spacing=".06em">DF ENTRADA</text>
    <text x="54" y="193" text-anchor="middle" font-size="12" fill="#CBD5E1" font-weight="600">NF-e / NFS-e</text>
    <text x="54" y="207" text-anchor="middle" font-size="9" fill="#475569">valorDF empresa</text>
  </g>
  <line x1="98" y1="181" x2="130" y2="181" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ETAPA 1 BOX -->
  <g id="etapa-1-apuracao">
    <rect x="132" y="60" width="180" height="240" rx="8" fill="#0D1628" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="222" y="82" text-anchor="middle" font-size="9" fill="#3B82F6" font-weight="700" letter-spacing=".08em">ETAPA 1 — APURAÇÃO</text>
    <line x1="148" y1="90" x2="296" y2="90" stroke="#3B82F6" stroke-opacity=".3" stroke-width="1"/>
    <text x="222" y="112" text-anchor="middle" font-size="9" fill="#64748B">valorDF vs valorGov</text>
    <polygon points="222,122 248,140 222,158 196,140" fill="none" stroke="#475569" stroke-width="1.5"/>
    <text x="222" y="136" text-anchor="middle" font-size="8.5" fill="#94A3B8">Δ ≤ R$5?</text>

    <!-- confirmado -->
    <g id="e1-confirmado">
      <rect x="148" y="174" width="148" height="38" rx="5" fill="#04201A" stroke="#14B8A6" stroke-width="1.5"/>
      <text x="222" y="191" text-anchor="middle" font-size="12" fill="#14B8A6" font-weight="700">confirmado</text>
      <text x="222" y="204" text-anchor="middle" font-size="8" fill="#2DD4BF">Conciliado · protocolo APU2026-</text>
    </g>
    <line x1="222" y1="158" x2="222" y2="174" stroke="#14B8A6" stroke-width="1.5" marker-end="url(#arr-teal)"/>
    <text x="228" y="170" font-size="8" fill="#14B8A6">sim</text>

    <!-- divergente -->
    <g id="e1-divergente">
      <rect x="148" y="232" width="148" height="38" rx="5" fill="#1A0509" stroke="#F43F5E" stroke-width="1.5"/>
      <text x="222" y="249" text-anchor="middle" font-size="12" fill="#F43F5E" font-weight="700">divergente</text>
      <text x="222" y="263" text-anchor="middle" font-size="8" fill="#F87171">Não conciliado · Δ destacado</text>
    </g>
    <path d="M 248 140 Q 310 140 310 251 Q 310 270 296 251" fill="none" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
    <text x="316" y="200" font-size="8" fill="#F43F5E">não</text>

    <!-- pendente -->
    <g id="e1-pendente">
      <rect x="148" y="286" width="148" height="38" rx="5" fill="#1C1304" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="222" y="303" text-anchor="middle" font-size="12" fill="#F59E0B" font-weight="700">pendente</text>
      <text x="222" y="317" text-anchor="middle" font-size="8" fill="#FCD34D">Gov ainda não apurou</text>
    </g>
    <line x1="196" y1="158" x2="180" y2="286" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr-amber)"/>
  </g>

  <!-- Bloqueio Etapa 2 -->
  <g id="etapa2-bloqueada">
    <rect x="330" y="286" width="130" height="38" rx="5" fill="#161B27" stroke="#334155" stroke-width="1.5"/>
    <text x="395" y="303" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">Etapa 2 bloqueada</text>
    <text x="395" y="317" text-anchor="middle" font-size="8" fill="#334155">aguardar apuração</text>
  </g>
  <line x1="296" y1="305" x2="330" y2="305" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="313" y="299" text-anchor="middle" font-size="8" fill="#475569">força</text>

  <!-- ETAPA 2 BOX -->
  <g id="etapa-2-financeira">
    <rect x="328" y="60" width="210" height="210" rx="8" fill="#04201A" stroke="#14B8A6" stroke-width="1.5"/>
    <text x="433" y="82" text-anchor="middle" font-size="9" fill="#14B8A6" font-weight="700" letter-spacing=".08em">ETAPA 2 — FINANCEIRA</text>
    <line x1="344" y1="90" x2="522" y2="90" stroke="#14B8A6" stroke-opacity=".25" stroke-width="1"/>
    <text x="433" y="108" text-anchor="middle" font-size="9" fill="#64748B">avalia IBS RF + CBS RF independentemente</text>
    <polygon points="433,118 461,136 433,154 405,136" fill="none" stroke="#475569" stroke-width="1.5"/>
    <text x="433" y="132" text-anchor="middle" font-size="8" fill="#94A3B8">IBS</text>
    <text x="433" y="143" text-anchor="middle" font-size="8" fill="#94A3B8">CBS</text>

    <!-- completo -->
    <g id="e2-completo">
      <rect x="344" y="172" width="88" height="36" rx="5" fill="#051911" stroke="#22C55E" stroke-width="1.5"/>
      <text x="388" y="189" text-anchor="middle" font-size="11" fill="#22C55E" font-weight="700">completo</text>
      <text x="388" y="201" text-anchor="middle" font-size="8" fill="#4ADE80">ambos pagos, sem inc.</text>
    </g>
    <line x1="405" y1="154" x2="388" y2="172" stroke="#22C55E" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- parcial -->
    <g id="e2-parcial">
      <rect x="344" y="224" width="88" height="36" rx="5" fill="#1C1304" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="388" y="241" text-anchor="middle" font-size="11" fill="#F59E0B" font-weight="700">parcial</text>
      <text x="388" y="253" text-anchor="middle" font-size="8" fill="#FCD34D">1 pago ou inc. presente</text>
    </g>
    <line x1="433" y1="154" x2="388" y2="224" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-amber)"/>

    <!-- inconsistente -->
    <g id="e2-inconsistente">
      <rect x="452" y="172" width="78" height="36" rx="5" fill="#1A0509" stroke="#F43F5E" stroke-width="1.5"/>
      <text x="491" y="186" text-anchor="middle" font-size="10" fill="#F43F5E" font-weight="700">inconsistente</text>
      <text x="491" y="199" text-anchor="middle" font-size="8" fill="#F87171">Não conciliado</text>
    </g>
    <line x1="461" y1="154" x2="491" y2="172" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>

    <!-- pendente e2 -->
    <g id="e2-pendente">
      <rect x="452" y="224" width="78" height="36" rx="5" fill="#1C1304" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="491" y="242" text-anchor="middle" font-size="10" fill="#F59E0B" font-weight="600">pendente</text>
      <text x="491" y="254" text-anchor="middle" font-size="8" fill="#FCD34D">nenhum pago</text>
    </g>
    <line x1="461" y1="154" x2="491" y2="224" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr-amber)"/>
  </g>

  <!-- arrows etapa1 → etapa2 -->
  <line x1="296" y1="193" x2="328" y2="140" stroke="#14B8A6" stroke-width="1.5" marker-end="url(#arr-teal)"/>
  <text x="300" y="165" font-size="8" fill="#14B8A6">avalia</text>
  <line x1="296" y1="251" x2="328" y2="180" stroke="#F43F5E" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-teal)"/>

  <!-- TERMINAL Crédito Apropriado -->
  <g id="terminal-credito-apropriado">
    <rect x="574" y="140" width="130" height="64" rx="8" fill="#051911" stroke="#22C55E" stroke-width="2"/>
    <text x="639" y="161" text-anchor="middle" font-size="9" fill="#22C55E" font-weight="700" letter-spacing=".07em">TERMINAL ✓</text>
    <text x="639" y="178" text-anchor="middle" font-size="13" fill="#22C55E" font-weight="700">Crédito</text>
    <text x="639" y="194" text-anchor="middle" font-size="13" fill="#22C55E" font-weight="700">Apropriado</text>
  </g>
  <line x1="538" y1="190" x2="574" y2="175" stroke="#22C55E" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="548" y="178" font-size="9" fill="#4ADE80">completo</text>
</svg>
