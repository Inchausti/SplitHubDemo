<svg viewBox="0 0 860 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748B"/></marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#14B8A6"/></marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#F43F5E"/></marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#F59E0B"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#22C55E"/></marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="320" fill="#0F172A"/>

  <!-- Title -->
  <text x="430" y="22" text-anchor="middle" font-size="11" fill="#94A3B8" font-weight="700" letter-spacing=".1em">JORNADA 1 — CICLO DE VIDA DO RF DE CRÉDITO (IBS / CBS)</text>

  <!-- DF INGERIDA -->
  <g id="df-entrada">
    <rect x="10" y="120" width="108" height="52" rx="6" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="64" y="142" text-anchor="middle" font-size="10" fill="#475569" font-weight="700" letter-spacing=".06em">INGESTÃO</text>
    <text x="64" y="158" text-anchor="middle" font-size="12" fill="#CBD5E1" font-weight="600">DF / NF-e</text>
    <text x="64" y="172" text-anchor="middle" font-size="9" fill="#475569">NF entrada</text>
  </g>

  <!-- arrow DF → RF -->
  <line x1="118" y1="146" x2="158" y2="146" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="138" y="140" text-anchor="middle" font-size="9" fill="#475569">gera RFs</text>

  <!-- NAO_APROPRIADO -->
  <g id="nao-apropriado">
    <rect x="160" y="110" width="128" height="60" rx="6" fill="#1F0A0D" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="224" y="131" text-anchor="middle" font-size="9" fill="#F43F5E" font-weight="700" letter-spacing=".06em">STATUS INICIAL</text>
    <text x="224" y="148" text-anchor="middle" font-size="13" fill="#F43F5E" font-weight="700">nao_apropriado</text>
    <text x="224" y="163" text-anchor="middle" font-size="9" fill="#F87171">aguardando apuração</text>
  </g>

  <!-- DECISAO prazo -->
  <g id="decisao-prazo">
    <polygon points="376,120 404,140 376,160 348,140" fill="none" stroke="#475569" stroke-width="1.5"/>
    <text x="376" y="144" text-anchor="middle" font-size="9" fill="#94A3B8">prazo?</text>
  </g>
  <line x1="288" y1="140" x2="344" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- VENCIDO -->
  <g id="vencido">
    <rect x="340" y="240" width="110" height="48" rx="6" fill="#1C1304" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="395" y="260" text-anchor="middle" font-size="13" fill="#F59E0B" font-weight="700">vencido</text>
    <text x="395" y="276" text-anchor="middle" font-size="9" fill="#FCD34D">prazo expirado · Art.48</text>
  </g>
  <line x1="376" y1="160" x2="376" y2="236" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-amber)"/>
  <text x="382" y="205" font-size="9" fill="#F59E0B">expirou</text>

  <!-- EM RISCO -->
  <g id="em-risco">
    <rect x="340" y="32" width="110" height="48" rx="6" fill="#1A0509" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="395" y="52" text-anchor="middle" font-size="13" fill="#F43F5E" font-weight="700">em_risco</text>
    <text x="395" y="68" text-anchor="middle" font-size="9" fill="#F87171">vencimento próximo</text>
  </g>
  <line x1="376" y1="120" x2="376" y2="84" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="382" y="108" font-size="9" fill="#F43F5E">30 dias</text>

  <!-- APURACAO GOV -->
  <g id="apuracao-gov">
    <rect x="458" y="110" width="130" height="60" rx="6" fill="#0D1628" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="523" y="131" text-anchor="middle" font-size="9" fill="#3B82F6" font-weight="700" letter-spacing=".06em">APURAÇÃO GOV</text>
    <text x="523" y="149" text-anchor="middle" font-size="12" fill="#60A5FA" font-weight="600">conciliação</text>
    <text x="523" y="163" text-anchor="middle" font-size="9" fill="#3B82F6">IBS + CBS pagos</text>
  </g>
  <line x1="404" y1="140" x2="454" y2="140" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr-teal)"/>
  <text x="429" y="134" text-anchor="middle" font-size="9" fill="#60A5FA">no prazo</text>

  <!-- INCONSISTENCIA -->
  <g id="inconsistencia">
    <rect x="644" y="240" width="116" height="48" rx="6" fill="#1A0509" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="702" y="260" text-anchor="middle" font-size="13" fill="#F43F5E" font-weight="700">inconsistencia</text>
    <text x="702" y="276" text-anchor="middle" font-size="9" fill="#F87171">RF requer revisão</text>
  </g>
  <path d="M 588 160 Q 588 264 644 264" fill="none" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="596" y="220" font-size="9" fill="#F43F5E">divergência</text>

  <!-- APROPRIADO -->
  <g id="apropriado">
    <rect x="644" y="110" width="116" height="60" rx="6" fill="#051911" stroke="#22C55E" stroke-width="1.5"/>
    <text x="702" y="131" text-anchor="middle" font-size="9" fill="#22C55E" font-weight="700" letter-spacing=".06em">TERMINAL ✓</text>
    <text x="702" y="149" text-anchor="middle" font-size="13" fill="#22C55E" font-weight="700">apropriado</text>
    <text x="702" y="163" text-anchor="middle" font-size="9" fill="#4ADE80">Art. 48 LC 214/2025</text>
  </g>
  <line x1="588" y1="140" x2="640" y2="140" stroke="#22C55E" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="614" y="134" text-anchor="middle" font-size="9" fill="#4ADE80">confirmado</text>

  <!-- UTILIZADO -->
  <g id="utilizado">
    <rect x="780" y="96" width="72" height="38" rx="5" fill="#051911" stroke="#22C55E" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="816" y="113" text-anchor="middle" font-size="11" fill="#22C55E" font-weight="600">utilizado</text>
    <text x="816" y="127" text-anchor="middle" font-size="8" fill="#4ADE80">abateu débito</text>
  </g>

  <!-- EXTINTO -->
  <g id="extinto">
    <rect x="780" y="146" width="72" height="38" rx="5" fill="#051911" stroke="#22C55E" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="816" y="163" text-anchor="middle" font-size="11" fill="#22C55E" font-weight="600">extinto</text>
    <text x="816" y="177" text-anchor="middle" font-size="8" fill="#4ADE80">prescrito/quitado</text>
  </g>

  <line x1="760" y1="130" x2="778" y2="115" stroke="#22C55E" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-green)"/>
  <line x1="760" y1="152" x2="778" y2="163" stroke="#22C55E" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-green)"/>
</svg>
